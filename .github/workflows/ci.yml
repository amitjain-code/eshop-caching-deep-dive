name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EShop.Caching.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build EShop.Caching.slnx -c Release --no-restore

      - name: Test
        run: dotnet test EShop.Caching.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"
