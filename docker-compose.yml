# Full multi-level caching stack:
#   browser -> cdn (nginx edge, :8080) -> gateway (YARP + Redis output cache) -> catalog / basket -> Redis + PostgreSQL
name: eshop-caching

services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  redisinsight:
    image: redis/redisinsight:latest
    ports: ["5540:5540"]
    depends_on: [redis]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalog
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  catalog-api:
    build:
      context: .
      dockerfile: src/Services/Catalog/Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__catalogdb: Host=postgres;Port=5432;Database=catalog;Username=postgres;Password=postgres
    deploy:
      replicas: 2            # two nodes => watch Pub/Sub keep both L1 caches coherent
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  basket-api:
    build:
      context: .
      dockerfile: src/Services/Basket/Basket.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__redis: redis:6379
    deploy:
      replicas: 2            # sessions + carts in Redis => no sticky sessions needed
    depends_on:
      redis: { condition: service_healthy }

  gateway:
    build:
      context: .
      dockerfile: src/Gateways/EShop.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__redis: redis:6379
      ReverseProxy__Clusters__catalog__Destinations__catalog-1__Address: http://catalog-api:8080/
      ReverseProxy__Clusters__basket__Destinations__basket-1__Address: http://basket-api:8080/
    ports: ["5000:8080"]
    depends_on: [catalog-api, basket-api]

  cdn:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:80"]
    depends_on: [gateway]

volumes:
  redis-data:
  pg-data:
