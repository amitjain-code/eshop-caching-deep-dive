# Redis is both a cache (HybridCache L2, output cache) and a primary store (carts, sessions, streams).
# Production: run two instances/roles; here one instance with settings that suit both.

# Persistence: AOF fsync every second => lose at most ~1 s of carts on a crash.
appendonly yes
appendfsync everysec

# Memory bound. volatile-lru evicts only keys WITH a TTL (cache entries, carts, sessions all have one)
# and never touches keys without TTL (stream, id map). Use allkeys-lru for a pure cache instance.
maxmemory 256mb
maxmemory-policy volatile-lru

# Observe hot keys / big keys:  redis-cli --hotkeys (needs LFU policy) / redis-cli --bigkeys
latency-monitor-threshold 25
slowlog-log-slower-than 10000

# Pub/Sub client output buffers: drop slow subscribers instead of exhausting memory.
client-output-buffer-limit pubsub 32mb 8mb 60
