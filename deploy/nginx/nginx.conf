# Local stand-in for a CDN edge (Cloudflare / Fastly / Front Door).
# Honors Cache-Control s-maxage, stale-while-revalidate and stale-if-error from the origin,
# and exposes X-Edge-Cache: HIT | MISS | EXPIRED | STALE | UPDATING | BYPASS.
worker_processes auto;
events { worker_connections 1024; }

http {
  proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge:20m max_size=200m inactive=1h use_temp_path=off;

  upstream gateway {
    server gateway:8080;
    keepalive 32;
  }

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Public catalog API: cacheable at the edge.
    location /api/catalog/ {
      proxy_pass http://gateway;
      proxy_cache edge;
      proxy_cache_key "$request_method|$host|$request_uri";
      proxy_cache_methods GET HEAD;
      proxy_cache_lock on;                 # collapse concurrent misses into one origin request
      proxy_cache_revalidate on;           # use If-None-Match / If-Modified-Since against origin
      proxy_cache_background_update on;    # stale-while-revalidate
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_bypass $http_x_user_id $http_authorization;   # personalised requests skip the edge
      proxy_no_cache     $http_x_user_id $http_authorization;
      add_header X-Edge-Cache $upstream_cache_status always;
    }

    # Everything else (basket, sessions, admin writes) is user-specific: never cached at the edge.
    location / {
      proxy_pass http://gateway;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      add_header X-Edge-Cache BYPASS always;
    }
  }
}
